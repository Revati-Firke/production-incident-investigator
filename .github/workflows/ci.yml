name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./...

  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Start stack
        run: |
          docker compose down -v --remove-orphans || true
          docker compose up --build -d
      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/v1/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Integration tests
        run: go test -tags=integration ./tests/integration/... -count=1 -v
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans || true
