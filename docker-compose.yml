services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: opspilot
      POSTGRES_DB: opspilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot -d opspilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    image: migrate/migrate:v4.18.2
    volumes:
      - ./migrations:/migrations
    command:
      - "-path=/migrations"
      - "-database=postgres://opspilot:opspilot@postgres:5432/opspilot?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy

  opspilot-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      HTTP_PORT: "8080"
      LOG_LEVEL: info
      DATABASE_URL: postgres://opspilot:opspilot@postgres:5432/opspilot?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: mock
      LLM_MODEL: mock-rca-v1
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  opspilot-worker:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/app/opspilot-worker"]
    environment:
      APP_ENV: development
      LOG_LEVEL: info
      DATABASE_URL: postgres://opspilot:opspilot@postgres:5432/opspilot?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: mock
      LLM_MODEL: mock-rca-v1
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      opspilot-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
